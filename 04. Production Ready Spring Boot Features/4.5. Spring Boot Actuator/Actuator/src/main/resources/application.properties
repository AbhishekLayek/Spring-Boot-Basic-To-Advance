spring.application.name=Actuator

#JPA & Hibernate Properties
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#MYSQL Properties
spring.datasource.url=jdbc:mysql://localhost:3306/prod_ready_features?createDatabaseIfNotExist=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=Abhishek@1519#

#Changing Server Port
server.port=9000

#Setting Third Party API Base URL
employeeService.base.url=http://localhost:8080/

#Logging Properties
logging.level.com.spring.Actuator.clients=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
logging.config=classpath:logback-spring.xml

#actuator configuration
management.endpoints.web.exposure.include=*
management.info.env.enabled=true
info.app.author=Abhishek Layek
info.app.version=1.0.0
management.endpoint.env.show-values=always
management.info.build.enabled=true
management.info.git.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true
