<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:linear-gradient(-45deg,#667eea,#764ba2,#23a6d5,#23d5ab);
    background-size:400% 400%;
    animation:gradient 12s ease infinite;
}

@keyframes gradient{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* Floating Circles */

.circle{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,0.12);
    animation:float 8s infinite ease-in-out;
}

.circle:nth-child(1){
    width:120px;
    height:120px;
    top:10%;
    left:8%;
}

.circle:nth-child(2){
    width:180px;
    height:180px;
    bottom:10%;
    right:10%;
    animation-duration:10s;
}

.circle:nth-child(3){
    width:70px;
    height:70px;
    top:75%;
    left:20%;
    animation-duration:6s;
}

.circle:nth-child(4){
    width:90px;
    height:90px;
    top:18%;
    right:18%;
    animation-duration:9s;
}

@keyframes float{
    0%,100%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(-25px);
    }
}

.card{
    position:relative;
    z-index:2;
    width:600px;
    max-width:90%;
    padding:45px;
    text-align:center;
    border-radius:25px;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.25);
    box-shadow:0 15px 40px rgba(0,0,0,.25);
    animation:fadeIn 1.2s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(40px) scale(.95);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.success-icon{
    width:100px;
    height:100px;
    margin:auto;
    border-radius:50%;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:55px;
    color:#27ae60;
    box-shadow:0 0 25px rgba(255,255,255,.5);
    animation:pop 1s ease;
}

@keyframes pop{
    0%{
        transform:scale(0);
    }
    70%{
        transform:scale(1.2);
    }
    100%{
        transform:scale(1);
    }
}

h1{
    margin-top:25px;
    font-size:40px;
    color:#fff;
    font-weight:700;
    animation:slideUp 1s ease;
}

.message{
    margin-top:20px;
    font-size:20px;
    color:#f8f9fa;
    line-height:1.7;
    animation:slideUp 1.3s ease;
}

.highlight{
    color:#ffe66d;
    font-weight:600;
}

.btn{
    margin-top:35px;
    display:inline-block;
    padding:14px 35px;
    border-radius:50px;
    background:#fff;
    color:#6c63ff;
    text-decoration:none;
    font-weight:600;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-4px);
    box-shadow:0 12px 25px rgba(0,0,0,.2);
}

@keyframes slideUp{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>

</head>
<body>

<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>

<div class="card">

    <div class="success-icon">✓</div>

    <h1>Welcome To Home Page</h1>

    <p class="message">
        🎉 Congratulations!<br><br>
        You have <span class="highlight">successfully logged in</span>
        using <span class="highlight">Google OAuth2 Authentication</span>.
    </p>

    <a href="#" class="btn">Explore More</a>

</div>

</body>
</html>
