<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome Home</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Three.js for 3D Ambient Canvas Background -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Plus Jakarta Sans', sans-serif;
}

:root {
    --bg-dark: #090d16;
    --card-bg: rgba(15, 23, 42, 0.65);
    --card-border: rgba(255, 255, 255, 0.12);
    --text-primary: #ffffff;
    --text-secondary: #94a3b8;
    --accent-glow: #6366f1;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background-color: var(--bg-dark);
    position: relative;
}

/* 3D Interactive Canvas Canvas */
#canvas-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
}

/* Ambient Glow Behind Card */
.glow-spot {
    position: absolute;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, rgba(168, 85, 247, 0.15) 40%, rgba(0, 0, 0, 0) 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    z-index: 2;
    pointer-events: none;
    filter: blur(40px);
}

/* Card Wrapper (Static, non-tilting) */
.card-wrapper {
    position: relative;
    z-index: 10;
    animation: cardEntrance 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.card {
    position: relative;
    width: 520px;
    max-width: 90vw;
    padding: 50px 40px;
    text-align: center;
    border-radius: 28px;
    background: var(--card-bg);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border: 1px solid var(--card-border);
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5),
                0 0 40px rgba(99, 102, 241, 0.15);
    overflow: hidden;
}

/* Dynamic Cursor Glow Layer inside Card */
.card-glow {
    position: absolute;
    top: var(--mouse-y, 50%);
    left: var(--mouse-x, 50%);
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0) 70%);
    transform: translate(-50%, -50%);
    pointer-events: none;
    transition: opacity 0.3s ease;
    border-radius: 50%;
}

/* Animated Checkmark Badge */
.icon-container {
    position: relative;
    width: 90px;
    height: 90px;
    margin: 0 auto 30px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.icon-bg {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: linear-gradient(135deg, #10b981, #059669);
    opacity: 0.2;
    animation: pulseRing 2.5s infinite ease-out;
}

.icon-box {
    width: 75px;
    height: 75px;
    border-radius: 50%;
    background: linear-gradient(135deg, #10b981, #059669);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
    animation: popIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s backwards;
}

.icon-box svg {
    width: 36px;
    height: 36px;
    stroke-dasharray: 50;
    stroke-dashoffset: 50;
    animation: drawCheck 0.6s ease forwards 0.7s;
}

/* Typography & Content Layering */
.badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 16px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 20px;
    animation: fadeIn 0.8s ease forwards 0.4s;
    opacity: 0;
}

.badge-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background-color: #10b981;
    box-shadow: 0 0 8px #10b981;
}

h1 {
    font-size: 32px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: -0.5px;
    margin-bottom: 12px;
    animation: fadeIn 0.8s ease forwards 0.5s;
    opacity: 0;
}

.message {
    font-size: 15px;
    color: var(--text-secondary);
    line-height: 1.6;
    margin-bottom: 35px;
    animation: fadeIn 0.8s ease forwards 0.6s;
    opacity: 0;
}

.provider-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #38bdf8;
    font-weight: 600;
}

/* Action Button */
.btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 16px 32px;
    border-radius: 16px;
    background: linear-gradient(135deg, #6366f1, #4f46e5);
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    animation: fadeIn 0.8s ease forwards 0.7s;
    opacity: 0;
}

.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 15px 30px rgba(99, 102, 241, 0.6);
    background: linear-gradient(135deg, #4f46e5, #4338ca);
}

.btn svg {
    width: 18px;
    height: 18px;
    transition: transform 0.3s ease;
}

.btn:hover svg {
    transform: translateX(4px);
}

/* Animations */
@keyframes cardEntrance {
    from {
        opacity: 0;
        transform: translateY(40px) scale(0.95);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes popIn {
    from { transform: scale(0); }
    to { transform: scale(1); }
}

@keyframes pulseRing {
    0% { transform: scale(0.95); opacity: 0.8; }
    50% { transform: scale(1.35); opacity: 0; }
    100% { transform: scale(0.95); opacity: 0; }
}

@keyframes drawCheck {
    to { stroke-dashoffset: 0; }
}

@keyframes fadeIn {
    to { opacity: 1; }
}
</style>
</head>
<body>

<!-- Three.js Canvas Container -->
<div id="canvas-container"></div>

<!-- Radial Ambient Background Glow -->
<div class="glow-spot"></div>

<!-- Main Card Wrapper -->
<div class="card-wrapper" id="cardWrapper">
    <div class="card" id="card">
        
        <div class="card-glow" id="cardGlow"></div>

        <div class="icon-container">
            <div class="icon-bg"></div>
            <div class="icon-box">
                <svg fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>
        </div>

        <div class="badge">
            <span class="badge-dot"></span> Authenticated Session
        </div>

        <h1>Welcome back!</h1>

        <p class="message">
            You have successfully verified your identity using <span class="provider-tag">
                <svg width="14" height="14" viewBox="0 0 24 24"><path fill="currentColor" d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.761H12.545z"/></svg> Google OAuth2
            </span>. Your dashboard is ready.
        </p>

        <a href="#" class="btn">
            <span>Continue to Dashboard</span>
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
        </a>

    </div>
</div>

<script>
/* ===================================================
   1. Dynamic Spotlight Effect (Tilt Movement Removed)
=================================================== */
const card = document.getElementById('card');
const cardWrapper = document.getElementById('cardWrapper');

cardWrapper.addEventListener('mousemove', (e) => {
    const rect = card.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    // Update internal spotlight position only
    card.style.setProperty('--mouse-x', `${x}px`);
    card.style.setProperty('--mouse-y', `${y}px`);
});

/* ===================================================
   2. Three.js Ambient Floating Particle Network
=================================================== */
const container = document.getElementById('canvas-container');

// Scene Setup
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 30;

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Create Particles
const particleCount = 120;
const geometry = new THREE.BufferGeometry();
const positions = new Float32Array(particleCount * 3);

for (let i = 0; i < particleCount * 3; i += 3) {
    positions[i] = (Math.random() - 0.5) * 80;
    positions[i + 1] = (Math.random() - 0.5) * 80;
    positions[i + 2] = (Math.random() - 0.5) * 50;
}

geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// Particle Material
const material = new THREE.PointsMaterial({
    color: 0x818cf8,
    size: 0.7,
    transparent: true,
    opacity: 0.5,
    blending: THREE.AdditiveBlending
});

const particles = new THREE.Points(geometry, material);
scene.add(particles);

// Mouse Interaction with Particles
let mouseX = 0;
let mouseY = 0;

document.addEventListener('mousemove', (e) => {
    mouseX = (e.clientX - window.innerWidth / 2) * 0.0008;
    mouseY = (e.clientY - window.innerHeight / 2) * 0.0008;
});

// Window Resize Handler
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// Render Loop
function animate() {
    requestAnimationFrame(animate);

    // Dynamic particle rotation based on movement
    particles.rotation.y += 0.001 + mouseX * 0.05;
    particles.rotation.x += 0.0005 + mouseY * 0.05;

    renderer.render(scene, camera);
}

animate();
</script>

</body>
</html>
